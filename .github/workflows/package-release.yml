name: Package and release DRG

run-name: Package DRG ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package and publish (must start with v and a digit)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  package-and-release:
    name: Build and release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *)
              echo "Release tag must start with v followed by a digit; got: $RELEASE_TAG" >&2
              exit 2
              ;;
          esac

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=vendor ./...
          go vet -mod=vendor ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          while IFS=':' read -r goos goarch extension; do
            output="dist/drg-${goos}-${goarch}${extension}"
            echo "Building ${goos}/${goarch}: ${output}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -mod=vendor -trimpath -ldflags='-s -w' -o "$output" ./cmd/drg
          done <<'TARGETS'
          windows:amd64:.exe
          windows:arm64:.exe
          linux:amd64:
          linux:arm64:
          darwin:amd64:
          darwin:arm64:
          TARGETS

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.7.0
          "$RUNNER_TEMP/bin/cyclonedx-gomod" mod -json -output dist/SBOM.cdx.json .

      - name: Generate checksums and build metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "tag=${RELEASE_TAG}"
            echo "commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > dist/BUILD-INFO.txt

          primary_assets=(
            dist/drg-windows-*
            dist/drg-linux-*
            dist/drg-darwin-*
            dist/SBOM.cdx.json
            dist/BUILD-INFO.txt
          )
          sha256sum "${primary_assets[@]}" > dist/SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign release assets with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          primary_assets=(
            dist/drg-windows-*
            dist/drg-linux-*
            dist/drg-darwin-*
            dist/SBOM.cdx.json
            dist/BUILD-INFO.txt
            dist/SHA256SUMS
          )
          for asset in "${primary_assets[@]}"; do
            cosign sign-blob --yes --bundle "${asset}.bundle" "$asset"
          done

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v6
        with:
          name: drg-${{ env.RELEASE_TAG }}
          path: |
            dist/drg-windows-*
            dist/drg-linux-*
            dist/drg-darwin-*
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
            dist/SBOM.cdx.json
            dist/SHA256SUMS.bundle
            dist/BUILD-INFO.txt.bundle
            dist/SBOM.cdx.json.bundle
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            dist/drg-windows-*
            dist/drg-linux-*
            dist/drg-darwin-*
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
            dist/SBOM.cdx.json
            dist/SHA256SUMS.bundle
            dist/BUILD-INFO.txt.bundle
            dist/SBOM.cdx.json.bundle
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
